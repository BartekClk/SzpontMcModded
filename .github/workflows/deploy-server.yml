name: Trigger MCS-MS Server Update

on:
  release:
    types: [published]
  workflow_dispatch:

jobs:
  trigger-mcsms:
    if: github.event_name == 'workflow_dispatch' || github.event.release.prerelease == false
    runs-on: ubuntu-latest
    steps:
      - name: Send update trigger to MCS-MS daemon
        env:
          WEBHOOK_URL: ${{ secrets.MCSMS_WEBHOOK_SZPONTMC_URL }}
          WEBHOOK_SECRET: ${{ secrets.MCSMS_WEBHOOK_SZPONTMC_SECRET }}
        run: |
          if [ -z "$WEBHOOK_URL" ] || [ -z "$WEBHOOK_SECRET" ]; then
            echo "Error: MCSMS_WEBHOOK_SZPONTMC_URL or MCSMS_WEBHOOK_SZPONTMC_SECRET is missing in Repository secrets."
            exit 1
          fi

          curl --fail-with-body -sS -X POST "$WEBHOOK_URL" \
            -H "Authorization: Bearer $WEBHOOK_SECRET" \
            -H "Content-Type: application/json" \
            -d '{"action": "published"}'